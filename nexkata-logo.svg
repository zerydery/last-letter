<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow-teal">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" fill="url(#bg-grad)"/>

  <!-- Glass card behind N -->
  <rect x="30" y="28" width="140" height="140" rx="22"
    fill="rgba(255,255,255,0.04)" stroke="rgba(0,255,179,0.15)" stroke-width="1.2"/>

  <!-- Blue neon N outline (outer, blurred) -->
  <polyline points="52,148 52,52 100,124 148,52 148,148"
    fill="none" stroke="#4FC3F7" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow-blue)" opacity="0.6"/>

  <!-- Teal neon N (inner, sharp) -->
  <polyline points="52,148 52,52 100,124 148,52 148,148"
    fill="none" stroke="#00FFB3" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow-teal)"/>

  <!-- Chain link circle (center, blue) -->
  <circle cx="100" cy="100" r="18"
    fill="none" stroke="#4FC3F7" stroke-width="4" stroke-dasharray="6 4"
    filter="url(#glow-blue)" opacity="0.9"/>

  <!-- Arrow upper-right -->
  <line x1="118" y1="68" x2="148" y2="40"
    stroke="#00FFB3" stroke-width="4" stroke-linecap="round" filter="url(#glow-teal)"/>
  <polyline points="134,38 148,38 148,52"
    fill="none" stroke="#00FFB3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#glow-teal)"/>
</svg>
